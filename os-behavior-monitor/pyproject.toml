[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "os-behavior-monitor"
version = "0.1.0"
description = "Review-2 Linux telemetry, anomaly detection, and selective LLM triage prototype"
requires-python = ">=3.11"
dependencies = ["psutil>=7.0,<8", "numpy>=2.2,<3", "scikit-learn>=1.6,<2", "python-dotenv>=1.0,<2"]

[project.scripts]
os-monitor = "osmonitor.cli:main"

[tool.setuptools.packages.find]
include = ["osmonitor*"]
